# fly.toml app configuration file generated for biblio-worker on 2026-04-25T18:05:21-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'biblio-worker'
primary_region = 'ord'

[build]

# No [http_service]: this is a polling worker, not an HTTP server.
# The machine must run 24/7 so the polling loop stays alive.

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
