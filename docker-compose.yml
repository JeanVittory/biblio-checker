services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_app_node_modules:/app/apps/frontend/node_modules
      - frontend_next:/app/apps/frontend/.next
    env_file:
      - apps/frontend/.env
    environment:
      - BIBLIO_BACKEND_CHECK_URL=http://backend:8000
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
      - backend_venv:/app/.venv
    env_file:
      - apps/backend/.env
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile.dev
    volumes:
      - ./apps/worker:/app
      - worker_venv:/app/.venv
    env_file:
      - apps/worker/.env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
  frontend_app_node_modules:
  frontend_next:
  backend_venv:
  worker_venv:
